name: Off-device restore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  off-device-producer:
    name: Produce synthetic backup on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.evidence.outputs.sha256 }}
      schema-version: ${{ steps.evidence.outputs.schema-version }}
      dataset-id: ${{ steps.evidence.outputs.dataset-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Produce the external recovery package
        run: npm run test:off-device-producer
        env:
          FLO_OFF_DEVICE_PACKAGE_DIR: ${{ runner.temp }}/off-device-package
          FLO_OFF_DEVICE_WORK_ROOT: ${{ runner.temp }}/off-device-producer-work

      - name: Export package evidence
        id: evidence
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ runner.temp }}/off-device-package
        run: |
          $manifest = Get-Content -LiteralPath (Join-Path $env:PACKAGE_DIR 'manifest.json') -Raw | ConvertFrom-Json
          "sha256=$($manifest.sha256)" >> $env:GITHUB_OUTPUT
          "schema-version=$($manifest.schemaVersion)" >> $env:GITHUB_OUTPUT
          "dataset-id=$($manifest.datasetId)" >> $env:GITHUB_OUTPUT

      - name: Upload the exact four-file recovery package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: synthetic-off-device-restore-v1
          path: ${{ runner.temp }}/off-device-package/*
          if-no-files-found: error
          retention-days: 3

  off-device-consumer:
    name: Restore on ${{ matrix.runner }}
    needs: off-device-producer
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synthetic-off-device-restore-v1
          path: ${{ runner.temp }}/off-device-package

      - name: Validate and restore into an independent destination
        run: npm run test:off-device-consumer
        env:
          FLO_OFF_DEVICE_PACKAGE_DIR: ${{ runner.temp }}/off-device-package
          FLO_OFF_DEVICE_DESTINATION_ROOT: ${{ runner.temp }}/off-device-restored-user-data
          FLO_OFF_DEVICE_EXPECTED_SHA256: ${{ needs.off-device-producer.outputs.sha256 }}

      - name: Record cross-runner evidence identity
        env:
          ARTIFACT_NAME: synthetic-off-device-restore-v1
          DATASET_ID: ${{ needs.off-device-producer.outputs.dataset-id }}
          PRODUCER_JOB: off-device-producer
          PRODUCER_OS: Windows
          PRODUCER_SHA256: ${{ needs.off-device-producer.outputs.sha256 }}
          SCHEMA_VERSION: ${{ needs.off-device-producer.outputs.schema-version }}
        run: node -e "console.log(JSON.stringify({producerJob:process.env.PRODUCER_JOB,producerOS:process.env.PRODUCER_OS,consumerJob:process.env.GITHUB_JOB,consumerOS:process.env.RUNNER_OS,artifact:process.env.ARTIFACT_NAME,sha256:process.env.PRODUCER_SHA256,schemaVersion:Number(process.env.SCHEMA_VERSION),datasetId:process.env.DATASET_ID}))"
