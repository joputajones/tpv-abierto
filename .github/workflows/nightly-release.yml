name: Full Cross-Platform Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-matrix:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            extra-deps: sudo apt-get update -qq && sudo apt-get install -y fakeroot dpkg openbox
          # Run each macOS package on its native architecture so the packaged
          # recovery-assistant smoke test exercises the executable itself.
          - os: macos-15-intel
            target: --mac --x64
            extra-deps: echo "No extra deps needed"
          - os: macos-latest
            target: --mac --arm64
            extra-deps: echo "No extra deps needed"
          - os: windows-latest
            target: --win
            extra-deps: echo "No extra deps needed"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install platform dependencies
        run: ${{ matrix.extra-deps }}

      - name: Install npm dependencies
        if: matrix.os != 'macos-15-intel'
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install npm dependencies on macOS Intel
        if: matrix.os == 'macos-15-intel'
        run: |
          npm ci --ignore-scripts
          npx --no-install install-electron
          codesign --force --deep --sign - --timestamp=none node_modules/electron/dist/Electron.app
          npx --no-install electron-builder install-app-deps
          npm run verify:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile main process
        run: npm run build

      - name: Run full platform test suite
        if: runner.os != 'Linux'
        run: npm test

      - name: Run full platform test suite under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/flo-openbox.log 2>&1 & npm test'

      - name: Package (unpacked directory, no installer)
        run: npx electron-builder ${{ matrix.target }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged isolated recovery assistant
        run: node scripts/verify-recovery-assistant-package.cjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flo-${{ matrix.os }}-${{ strategy.job-index }}-${{ github.run_number }}
          path: release/
          retention-days: 7
